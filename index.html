<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南山產物 | 專屬車險規劃顧問</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- 密碼解鎖遮罩層 -->
    <div id="lockScreen" class="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 text-center border border-slate-100">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                🔒
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">保單專屬加密</h2>
            <p class="text-slate-500 text-sm mb-6">為了保護客戶隱私，請輸入車牌後四碼（提示：2752）以解鎖檢視詳細保單內容。</p>
            
            <div class="space-y-4">
                <input type="password" id="pinInput" maxlength="4" placeholder="請輸入車牌後四碼" class="w-full px-4 py-3 text-center text-2xl tracking-widest border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <div id="errorMsg" class="text-rose-500 text-xs hidden">密碼錯誤，請重新輸入（預設為 2752）</div>
                <button onclick="checkPin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-blue-500/25">
                    立即解鎖
                </button>
            </div>
