<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽車保險專屬規劃 - 徐婉甄小姐</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #1a365d; margin-bottom: 10px; }
        p { color: #4a5568; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        input { width: 100%; padding: 12px; font-size: 18px; text-align: center; border: 2px solid #e2e8f0; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #3182ce; }
        button { width: 100%; padding: 12px; background: #3182ce; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:active { background: #2b6cb0; }
        .error { color: #e53e3e; font-size: 13px; margin-top: 10px; display: none; }
        .content-box { display: none; width: 100%; max-width: 600px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: left; }
    </style>
</head>
<body>
    <!-- 密碼鎖定畫面 -->
    <div id="lock-screen" class="card">
        <h2>🔒 專屬保險規劃</h2>
        <p>為保障個人隱私，請輸入車牌後 4 碼解鎖檢視</p>
        <input type="password" id="pwd" placeholder="請輸入 4 位數密碼" maxlength="4" inputmode="numeric">
        <button onclick="checkPwd()">立即解鎖</button>
        <div id="err" class="error">密碼錯誤，請重新輸入（預設為車牌後 4 碼）</div>
    </div>

    <!-- 解鎖後的保單內容 -->
    <div id="content" class="content-box">
        <h2 style="color:#2b6cb0; border-bottom:2px solid #ebf8ff; padding-bottom:10px; margin-top:0;">🚗 汽車保險專屬規劃</h2>
        <p><strong>被保險人：</strong>徐婉甄小姐</p>
        <p><strong>車型：</strong>Toyota Corolla Cross Hybrid (車牌：BXB-2752)</p>
        <p><strong>服務專員：</strong>陳姵彣 (南山產物)</p>
        <hr style="border:0; border-top:1px solid #edf2f7; margin:15px 0;">
        <h3 style="color:#2d3748; font-size:16px;">📋 保障內容摘要</h3>
        <ul style="color:#4a5568; line-height:1.8; font-size:14px; padding-left:20px;">
            <li>強制責任險 + 第三責任險</li>
            <li>車體險（乙式）與竊盜損失險</li>
            <li>乘客體傷責任險 & 駕駛人傷害險</li>
        </ul>
        <div style="background:#f7fafc; padding:15px; border-radius:8px; margin-top:20px; text-align:center; color:#718096; font-size:13px;">
            南山產物保險專業服務 • 您的行車安全守護者
        </div>
    </div>

    <script>
        function checkPwd() {
            const val = document.getElementById('pwd').value;
            if (val === '2752') {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } else {
                document.getElementById('err').style.display = 'block';
            }
        }
        document.getElementById('pwd').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { checkPwd(); }
        });
    </script>
</body>
</html>
